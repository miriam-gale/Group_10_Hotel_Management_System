<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Grand Horizon Hotel</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/modules.css">
</head>

<body class="login-page">

    <div class="login-card">

        <div class="brand">
            <div class="brand-icon">✦</div>
            <div class="brand-name">GRAND HORIZON</div>
            <div class="brand-subtitle">HOTEL</div>
        </div>

        <h1>Sign in</h1>
        <p class="login-subtitle">Access the hotel management system.</p>

        <p class="form-error" id="loginError"></p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="you@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password">
            </div>

            <button type="submit" class="primary-button">Login</button>

        </form>

        <p class="login-hint">
            Placeholder login: any valid email and a non-empty password will continue.
        </p>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
