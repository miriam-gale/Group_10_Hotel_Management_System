<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reports | Grand Horizon Hotel</title>

    <!-- Your existing CSS -->
    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>

<div class="app">


    <!-- ======================================================
         SIDEBAR
    ======================================================= -->

    <aside class="sidebar">

        <div class="brand">

            <div class="brand-icon">
                ★
            </div>

            <div class="brand-name">
                GRAND HORIZON
            </div>

            <div class="brand-subtitle">
                HOTEL
            </div>

        </div>


        <nav class="sidebar-nav">


            <a
                href="../index.html"
                class="nav-item"
            >


                <span>
                    Dashboard
                </span>

            </a>


            <a
                href="rooms.html"
                class="nav-item"
            >

                

                <span>
                    Rooms
                </span>

            </a>


            <a
                href="reservations.html"
                class="nav-item"
            >

                

                <span>
                    Reservations
                </span>

            </a>


            <a
                href="checkin.html"
                class="nav-item"
            >

                

                <span>
                    Check-in / Check-out
                </span>

            </a>


            <a href="feedback.html" class="nav-item">
    <span class="nav-icon">★</span>
    <span>Feedback</span>
</a>


            <a
                href="reports.html"
                class="nav-item active"
            >

                

                <span>
                    Reports
                </span>

            </a>


        </nav>


        <!-- SIDEBAR USER -->

        <div class="sidebar-user">

            <div class="user-avatar">
                MG
            </div>


            <div class="user-info">

                <strong>
                    Miriam Gale
                </strong>

                <span>
                    Admin
                </span>

            </div>

        </div>


    </aside>



    <!-- ======================================================
         MAIN AREA
    ======================================================= -->

    <div class="main-area">


        <!-- ==================================================
             TOPBAR
        =================================================== -->

        <header class="topbar">


            <div class="topbar-brand">
                Grand Horizon Hotel
            </div>


            <div class="search-box">

                <span>
                    ⌕
                </span>

                <input
                    type="text"
                    placeholder="Search anything..."
                >

            </div>


            <div class="topbar-user">


                <div class="notification">

                    ♧

                    <span>
                        3
                    </span>

                </div>


                <div class="topbar-divider"></div>


                <div class="profile-avatar">
                    MG
                </div>


                <div class="profile-info">

                    <strong>
                        Miriam Gale
                    </strong>

                    <span>
                        Admin
                    </span>

                </div>


            </div>


        </header>



        <!-- ==================================================
             PAGE CONTENT
        =================================================== -->

        <main class="page-content">


            <!-- PAGE HEADING -->

            <div class="page-heading">


                <div>

                    <h1>
                        Reports
                    </h1>


                    <p>
                        Generate reports on hotel operations and performance.
                    </p>

                </div>


                <!-- REPORT ACTIONS -->

                <div class="reports-actions">


                    <!-- REPORT TYPE -->

                    <select
                        id="reportType"
                        class="report-select"
                    >

                        <option value="overview">
                            Overall Report
                        </option>


                        <option value="revenue">
                            Revenue Report
                        </option>


                        <option value="occupancy">
                            Room Occupancy Report
                        </option>


                        <option value="reservations">
                            Reservation Report
                        </option>

                    </select>


                    <!-- NO GENERATE BUTTON -->

                    <button
                        type="button"
                        id="printReport"
                        class="report-button secondary"
                    >
                        Print / Save PDF
                    </button>


                </div>


            </div>



            <!-- ==================================================
                 REPORT AREA

                 reports.js automatically loads the report
                 when the page opens.
            =================================================== -->

            <div id="reportContainer">


                <!-- SUMMARY CARDS -->

                <div
                    id="reportStats"
                    class="report-grid"
                ></div>


                <!-- REPORT DETAILS -->

                <div
                    id="reportContent"
                ></div>


            </div>


        </main>


    </div>


</div>



<!-- ==========================================================
     REPORT JAVASCRIPT
=========================================================== -->

<script src="../js/reports.js"></script>


</body>

</html>
