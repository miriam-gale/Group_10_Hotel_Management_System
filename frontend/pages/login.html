<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Grand Horizon Hotel</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <!-- BRAND -->
            <div class="login-brand">
                <div class="login-brand-icon">★</div>

                <h1>GRAND HORIZON</h1>

                <span>HOTEL</span>
            </div>


            <!-- --------LOGIN VIEW------ -->

            <div id="loginView">

                <!-- HEADING -->
                <div class="login-heading">
                    <h2>Welcome Back</h2>

                    <p>
                        Sign in to access your Grand Horizon account.
                    </p>
                </div>


                <!-- ACCOUNT TYPE -->
                <div class="form-group">

                    <label for="userType">
                        Sign in as
                    </label>

                    <select id="userType">

                        <option value="customer">
                            Customer
                        </option>

                        <option value="event-staff">
                            Event Staff
                        </option>

                        <option value="administrator">
                            Administrator
                        </option>

                        <option value="finance">
                            Finance/Billing Staff
                        </option>

                    </select>

                </div>


                <!-- LOGIN FORM -->
                <form id="loginForm">

                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <!-- LOGIN ERROR -->
                    <p
                        id="loginError"
                        class="login-error"
                        aria-live="polite"
                    ></p>


                    <!-- SIGN IN BUTTON -->
                    <button
                        type="submit"
                        class="primary-button login-button"
                        id="loginButton"
                    >
                        Sign In
                    </button>

                </form>


                <!-- CUSTOMER REGISTRATION LINK -->
                <p
                    id="customerRegister"
                    class="login-note"
                >
                    Don't have an account?

                    <a
                        href="#"
                        id="registerLink"
                    >
                        Create an account
                    </a>
                </p>

            </div>


            <!-- ----REGISTRATION VIEW---- -->

            <div
                id="registerView"
                style="display: none;"
            >

                <div class="login-heading">

                    <h2>Create Account</h2>

                    <p>
                        Create your Grand Horizon customer account.
                    </p>

                </div>


                <form id="registerForm">

                    <!-- FIRST NAME -->
                    <div class="form-group">

                        <label for="registerFirstName">
                            First Name
                        </label>

                        <input
                            type="text"
                            id="registerFirstName"
                            placeholder="Enter your first name"
                            autocomplete="given-name"
                            required
                        >

                    </div>


                    <!-- LAST NAME -->
                    <div class="form-group">

                        <label for="registerLastName">
                            Last Name
                        </label>

                        <input
                            type="text"
                            id="registerLastName"
                            placeholder="Enter your last name"
                            autocomplete="family-name"
                            required
                        >

                    </div>


                    <!-- EMAIL -->
                    <div class="form-group">

                        <label for="registerEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            placeholder="Enter your email"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- CONTACT NUMBER -->
                    <div class="form-group">

                        <label for="registerContact">
                            Contact Number
                        </label>

                        <input
                            type="tel"
                            id="registerContact"
                            placeholder="Enter your contact number"
                            autocomplete="tel"
                            required
                        >

                    </div>


                    <!-- PASSWORD -->
                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <!-- CONFIRM PASSWORD -->
                    <div class="form-group">

                        <label for="registerConfirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="registerConfirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                    </div>


                    <!-- REGISTRATION ERROR -->
                    <p
                        id="registerError"
                        class="login-error"
                        aria-live="polite"
                    ></p>


                    <!-- CREATE ACCOUNT -->
                    <button
                        type="submit"
                        class="primary-button login-button"
                        id="registerButton"
                    >
                        Create Account
                    </button>

                </form>


                <!-- BACK TO LOGIN -->
                <p class="login-note">

                    Already have an account?

                    <a
                        href="#"
                        id="backToLogin"
                    >
                        Sign in
                    </a>

                </p>

            </div>

        </section>

    </main>


    <!-- LOGIN JAVASCRIPT -->
    <script src="../js/login.js"></script>

</body>

</html>
