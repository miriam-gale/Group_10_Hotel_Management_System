<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manager Login | Grand Horizon Hotel</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <div class="login-brand">
                <div class="login-brand-icon">★</div>

                <h1>GRAND HORIZON</h1>

                <span>HOTEL</span>
            </div>


            <div class="login-heading">

                <h2>Manager Login</h2>

                <p>
                    Sign in to access the hotel management system.
                </p>

            </div>


            <form id="managerLoginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <p
                    id="loginError"
                    class="login-error"
                ></p>


                <button
                    type="submit"
                    class="primary-button login-button"
                >
                    Sign In
                </button>

            </form>


            <p class="login-note">
                Manager access only
            </p>

        </section>

    </main>


    <script src="../js/login.js"></script>

</body>

</html>
