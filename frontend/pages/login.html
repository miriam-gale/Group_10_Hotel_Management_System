<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Grand Horizon Hotel</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-page">

    <main class="login-container">

        <section class="login-card">

            <!-- BRAND -->
            <div class="login-brand">
                <div class="login-brand-icon">★</div>

                <h1>GRAND HORIZON</h1>

                <span>HOTEL</span>
            </div>


            <!-- HEADING -->
            <div class="login-heading">
                <h2>Welcome Back</h2>

                <p>
                    Sign in to access your Grand Horizon account.
                </p>
            </div>


            <!-- ACCOUNT TYPE -->
            <div class="form-group">

                <label for="userType">
                    Sign in as
                </label>

                <select id="userType">

                    <option value="customer">
                        Customer
                    </option>

                    <option value="event-staff">
                        Event Staff
                    </option>

                    <option value="administrator">
                        Administrator
                    </option>

                    <option value="finance">
                        Finance/Billing Staff
                    </option>

                </select>

            </div>


            <!-- LOGIN FORM -->
            <form id="loginForm">

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- LOGIN ERROR -->
                <p
                    id="loginError"
                    class="login-error"
                    aria-live="polite"
                ></p>


                <!-- SIGN IN BUTTON -->
                <button
                    type="submit"
                    class="primary-button login-button"
                    id="loginButton"
                >
                    Sign In
                </button>

            </form>


            <!-- CUSTOMER REGISTRATION -->
            <p
                id="customerRegister"
                class="login-note"
            >
                Don't have an account?
                <a
                    href="#"
                    id="registerLink"
                >
                    Create an account
                </a>
            </p>

        </section>

    </main>


    <!-- LOGIN JAVASCRIPT -->
    <script src="../js/login.js"></script>

</body>

</html>
